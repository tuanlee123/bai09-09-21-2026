<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head(${mode == 'create' ? 'Thêm Product' : 'Sửa Product'})}"></head>
<body>
<div th:replace="~{layouts/layout :: page(~{::main})}">
<main>
    <div class="form-card">
        <h1 th:text="${mode == 'create' ? 'Thêm Product' : 'Sửa Product'}"></h1>
        <form th:object="${productDTO}" method="post" enctype="multipart/form-data"
              th:action="${mode == 'create'} ? @{/products/create} : @{/products/edit/{id}(id=${productDTO.id})}">
            <input type="hidden" th:field="*{id}">

            <div>
                <label for="name">Tên sản phẩm</label>
                <input type="text" id="name" th:field="*{name}">
                <small class="error-text" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
            </div>

            <div>
                <label for="description">Mô tả</label>
                <textarea id="description" th:field="*{description}" rows="4"></textarea>
            </div>

            <div>
                <label for="price">Giá</label>
                <input type="number" id="price" step="0.01" th:field="*{price}">
                <small class="error-text" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></small>
            </div>

            <div>
                <label for="image">Ảnh sản phẩm</label>
                <input type="file" id="image" name="image" accept="image/*">
            </div>

            <div th:if="${productDTO.imageUrl != null}">
                <img th:if="${#strings.contains(productDTO.imageUrl, '|')}"
                     th:src="${#strings.substringBefore(productDTO.imageUrl, '|')}" class="preview">
                <img th:unless="${#strings.contains(productDTO.imageUrl, '|')}"
                     th:src="${productDTO.imageUrl}" class="preview">
            </div>

            <div class="mt">
                <button type="submit" class="button">Lưu</button>
                <a class="button secondary" th:href="@{/products}">Hủy</a>
            </div>
        </form>
    </div>
</main>
</div>
</body>
</html>
